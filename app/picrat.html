<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICRAT 진단 - 질문 선택 → 코드 생성</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/App.css" />
    <style>
      .picrat-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }

      .question-section {
        margin-bottom: 30px;
      }

      .question-title {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 20px;
        color: var(--text);
      }

      .option-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .option-btn {
        background: var(--btn2);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 16px 20px;
        text-align: center;
        font-size: 1rem;
        color: var(--text);
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 600;
      }

      .option-btn:hover {
        border-color: #667eea;
        background: rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
      }

      .option-btn.selected {
        border-color: #667eea;
        background: rgba(102, 126, 234, 0.2);
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .option-label {
        display: block;
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 4px;
      }

      .result-card {
        background: rgba(20,22,32,.92);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
        margin-top: 30px;
        display: none;
      }

      .result-card.show {
        display: block;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result-code {
        font-size: 3rem;
        font-weight: bold;
        text-align: center;
        margin: 20px 0;
        color: #667eea;
        text-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
      }

      .result-description {
        background: rgba(10,12,18,.6);
        border-radius: 12px;
        padding: 20px;
        margin: 20px 0;
        line-height: 1.7;
        color: var(--text);
        border-left: 4px solid #667eea;
      }

      .copy-btn {
        width: 100%;
        margin-top: 16px;
      }

      .nav-menu {
        display: flex;
        gap: 8px;
        margin-bottom: 30px;
        flex-wrap: wrap;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      .nav-item {
        background: var(--btn2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-block;
      }

      .nav-item:hover {
        background: var(--btn);
        border-color: #667eea;
      }

      .nav-item.active {
        background: rgba(102, 126, 234, 0.2);
        border-color: #667eea;
        color: #667eea;
      }

      @media (min-width: 768px) {
        .option-buttons {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="picrat-container">
      <!-- 네비게이션 메뉴 -->
      <nav class="nav-menu">
        <a href="/" class="nav-item">🏠 홈</a>
        <a href="/picrat.html" class="nav-item active">🧠 PICRAT 진단</a>
        <a href="/index.html" class="nav-item">🧩 As Is → To Be 청사진</a>
        <a href="/app/index.html" class="nav-item">📋 청사진 작성 도우미</a>
      </nav>

      <h1>🧠 PICRAT 진단</h1>
      <p class="sub">
        교안의 PICRAT 질문을 선택하면 코드가 즉시 산출됩니다.
      </p>

      <!-- 질문 1 -->
      <div class="question-section">
        <div class="card">
          <h2 class="question-title">질문 1: "학생과 기술의 관계는?"</h2>
          <div class="option-buttons" id="question1-buttons">
            <button class="option-btn" data-value="P">
              P
              <span class="option-label">수동적</span>
            </button>
            <button class="option-btn" data-value="I">
              I
              <span class="option-label">상호작용</span>
            </button>
            <button class="option-btn" data-value="C">
              C
              <span class="option-label">창의적</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 질문 2 -->
      <div class="question-section">
        <div class="card">
          <h2 class="question-title">질문 2: "기술 사용이 교사의 실천에 미치는 영향은?"</h2>
          <div class="option-buttons" id="question2-buttons">
            <button class="option-btn" data-value="R">
              R
              <span class="option-label">대체</span>
            </button>
            <button class="option-btn" data-value="A">
              A
              <span class="option-label">증폭</span>
            </button>
            <button class="option-btn" data-value="T">
              T
              <span class="option-label">변형</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 결과 카드 -->
      <div class="result-card" id="result-card">
        <h2 style="text-align: center; margin-bottom: 20px;">결과</h2>
        <div class="result-code" id="result-code"></div>
        <div class="result-description" id="result-description"></div>
        <button class="btn copy-btn" id="copy-btn">공유용 복사</button>
      </div>
    </div>

    <script type="module" src="/picrat.js"></script>
  </body>
</html>
